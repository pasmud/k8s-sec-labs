apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiet-workload
  namespace: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiet-workload
  template:
    metadata:
      labels:
        app: quiet-workload
    spec:
      automountServiceAccountToken: false
      os:
        name: linux
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inventory-settings-reader
  namespace: inventory
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [inventory-settings]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inventory-settings-readers
  namespace: inventory
subjects:
  - kind: Group
    name: inventory-settings-readers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inventory-settings-reader
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-quiet-workload
  namespace: inventory
spec:
  podSelector:
    matchLabels:
      app: quiet-workload
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
